<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Card Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121c;--panel:#1d1a29;--line:#322d45;--tx:#ece6d6;--mut:#a39cb8;--acc:#e0b64a;--warn:#e8735f}
@media (prefers-color-scheme:light){:root{--bg:#f6f2e8;--panel:#fffdf7;--line:#d9d0bb;--tx:#241f33;--mut:#6b6480;--acc:#8a6410;--warn:#b6402c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 2rem/1.1 Alegreya,Georgia,serif;margin:8px 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
button{font:inherit;font-weight:600;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:16px;margin-top:16px;display:flex;gap:16px;flex-wrap:wrap}
.card img{width:220px;max-width:100%;border-radius:10px;align-self:flex-start}
.body{flex:1;min-width:240px}
.card h2{font:700 1.5rem/1.2 Alegreya,Georgia,serif;margin:0}
.meta{color:var(--mut);font-size:.9rem;margin:2px 0 10px}
.card h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:14px 0 4px}
.card p{margin:0 0 6px;white-space:pre-line}
.note{color:var(--mut);font-size:.82rem;margin-top:14px}
.msg{margin-top:16px;color:var(--mut)}.err{color:var(--warn)}
a{color:var(--acc)}
</style>
</head>
<body>
<main><nav style="margin-bottom:8px"><a href="index.html">Card lookup</a> · <a href="keywords.html">Keyword guide</a></nav>
<h1>MTG card lookup</h1>
<p class="sub">Type a card name to see its details and an example of how to use it.</p>
<form class="row" id="f">
<input id="q" list="sug" placeholder="e.g. Lightning Bolt" autocomplete="off" aria-label="Card name">
<datalist id="sug"></datalist>
<button id="go" type="submit">Look up</button>
</form>
<div id="out" aria-live="polite"></div>
</main>
<script>
const out=document.getElementById('out'),go=document.getElementById('go'),q=document.getElementById('q'),sug=document.getElementById('sug');
const KW={flying:"Flying means only flyers and reach creatures can block it, so attack in the air.",reach:"Reach lets it block flyers, so keep it home on defense.",trample:"Trample pushes extra damage through a blocker to the opponent.",deathtouch:"Deathtouch kills anything it damages, so it makes a great blocker.",lifelink:"Lifelink gains you life when it deals damage, which helps you race.",haste:"Haste lets it attack right away, so play it when the opponent is low.",vigilance:"Vigilance lets it attack and still block next turn.","first strike":"First strike deals damage first, so it wins fights against creatures it can kill before they hit back.","double strike":"Double strike hits twice, so pump or equipment is extra strong on it.",menace:"Menace needs two blockers, so attack when the opponent has few creatures.",flash:"Flash lets you cast it on your opponent's turn as a surprise.",hexproof:"Hexproof stops opponents from targeting it with removal.",indestructible:"Indestructible survives damage and destroy effects, but not exile.",defender:"Defender can't attack, so use it as a wall.",ward:"Ward taxes opponents who target it with spells or abilities.",cycling:"Cycling lets you discard it to draw when you don't need it.",kicker:"Kicker lets you pay extra later for a bigger effect.",flashback:"Flashback lets you cast it again from the graveyard.",scry:"Scry lets you look at the top cards and keep or bottom them.",equip:"Equip attaches it to a creature, and you can move it later.",prowess:"Prowess grows it when you cast noncreature spells.",landfall:"Landfall triggers when a land enters, so hold lands to trigger it each turn."};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function msg(t,err){return el('p','msg'+(err?' err':''),t)}
function show(n){out.replaceChildren(n)}
function example(c){
const f=c.card_faces&&!c.type_line?c.card_faces[0]:c,t=(c.type_line||f.type_line||'').toLowerCase();
const txt=(c.oracle_text||(c.card_faces?c.card_faces.map(x=>x.oracle_text).join(' '):'')).toLowerCase();
const n=c.name,m=Math.max(Math.round(c.cmc||0),1),pl=m===1?'land':'lands';
let s;
if(t.includes('land'))s="Play "+n+" as your land drop for the turn. Hold it if you need to bluff or want to trigger landfall, but never miss a drop early in the game.";
else if(t.includes('creature'))s="Around turn "+m+" you tap "+m+" "+pl+" and cast "+n+". It can block on your opponent's turn, then attack the turn after if the opponent has no good blockers. Check the opposing board first, and keep it home if the trade is bad.";
else if(t.includes('planeswalker'))s="On turn "+m+" cast "+n+" when you have blockers to protect it. Use a loyalty ability each turn, and aim attackers at it if the opponent plays one.";
else if(t.includes('instant'))s="Keep "+m+" "+pl+" untapped on your opponent's turn. When they attack, cast "+n+" at the moment it hurts them most, such as after blockers are declared or in response to their spell.";
else if(t.includes('sorcery'))s="On your main phase with "+m+" "+pl+", cast "+n+" when it makes the biggest difference, such as clearing a blocker before you attack. It can't be cast on your opponent's turn.";
else if(t.includes('aura')||t.includes('equipment'))s="Cast "+n+" on turn "+m+" and attach it to your best creature. Watch for removal in response, because you could lose both cards.";
else if(t.includes('enchantment')||t.includes('artifact'))s="Cast "+n+" on turn "+m+" and leave it on the battlefield for its ongoing effect. Cast it early if it helps you every turn.";
else s="Cast "+n+" with "+m+" "+pl+" when its effect fits the board.";
const h=Object.keys(KW).filter(k=>txt.includes(k)).slice(0,3).map(k=>KW[k]);
return s+(h.length?"\n\nTips: "+h.join(" "):"");
}
async function lookup(name){
go.disabled=true;show(msg('Looking up "'+name+'"…'));
try{
const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(name));
if(r.status===404){show(msg('No card found for "'+name+'". Check the spelling or try a shorter name.',true));return}
if(!r.ok)throw 0;
const c=await r.json(),face=c.card_faces&&!c.oracle_text?c.card_faces:null;
const card=el('article','card');
const im=(c.image_uris||(c.card_faces&&c.card_faces[0].image_uris)||{}).normal;
if(im){const i=el('img');i.src=im;i.alt=c.name;card.append(i)}
const b=el('div','body');
b.append(el('h2',null,c.name),el('p','meta',[c.mana_cost,c.type_line,c.power?c.power+'/'+c.toughness:'',c.rarity,(c.set_name||'')].filter(Boolean).join(' · ')));
b.append(el('h3',null,'Card text'));
b.append(el('p',null,face?face.map(x=>x.name+'\n'+x.oracle_text).join('\n\n'):(c.oracle_text||'(no rules text)')));
b.append(el('h3',null,'Example of use'),el('p',null,example(c)));
if(c.legalities)b.append(el('h3',null,'Formats'),el('p',null,['standard','modern','commander','pioneer'].map(k=>k[0].toUpperCase()+k.slice(1)+': '+c.legalities[k].replace('_',' ')).join(' · ')));
const n=el('p','note','Card data from ');const a=el('a',null,'Scryfall');a.href=c.scryfall_uri;a.target='_blank';a.rel='noopener noreferrer';n.append(a,'.');
b.append(n);card.append(b);show(card);
}catch(e){show(msg('Could not reach Scryfall. Check your connection and try again.',true))}
finally{go.disabled=false}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=q.value.trim();if(v)lookup(v)});
let t;q.addEventListener('input',()=>{clearTimeout(t);const v=q.value.trim();if(v.length<2)return;t=setTimeout(async()=>{try{const r=await fetch('https://api.scryfall.com/cards/autocomplete?q='+encodeURIComponent(v));const d=await r.json();sug.replaceChildren(...(d.data||[]).map(x=>{const o=el('option');o.value=x;return o}))}catch(e){}},250)});
</script>
</body>
</html>
